<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Entry</title>
    <link rel="stylesheet" href="/static/style/book_entry.css">
</head>
<body>
    {% include 'book_entry_header.html'%}
    <div class="form-background">
        <div class="title">
            Book Registration :
            <form action="/book_entry" method="POST">
                <label for="book_id">Book ID:</label>
                <input type="number" id="book_id" name="book_id" value="Book Number"><br>
                
                <label for="book_title">Book Title:</label>
                <input type="text" id="book_title" name="book_title"><br>
                
                <label for="book_author">Book Author:</label>
                <input type="text" id="book_author" name="book_author"><br>
                
                <label for="book_category">Book Category:</label>
                <input type="text" id="book_category" name="book_category"><br>
                
                <label for="book_copies">Total Copies:</label>
                <input type="number" id="book_copies" name="book_copies"><br>
                
                <label for="available_copies">Available Copies:</label>
                <input type="text" id="available_copies" name="available_copies"><br>

                <input type="submit" value="Submit">
            </form>

            <a href="{{url_for('show_all_book')}}"> Show full book list</a>
        </div>
    </div>
</body>
</html>
